version: '3.8'

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - celery

  celery:
    build:
      context: .
      dockerfile: Dockerfile.celery
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend/backend:/app
    env_file:
      - .env
